# Copy to .github/workflows/apply-feedback.yml in the private inbox repository.
# Replace both REPLACE_WITH_ENGINE_SHA values with the same full 40 character
# commit SHA of opencampingdb/feedback-engine, and update them together.
#
# Replace REPLACE_WITH_INTAKE_URL with the intake's base URL, or remove the
# intake-url and places-token lines when the intake has no RECENT_LIST.
#
# release-workflow starts the data repository's release once the automatic PR
# has merged. It needs Actions: Read and write on the bot App. Remove the line
# to leave releases to their own schedule.
#
# The hourly schedule is a back-up. An intake with APPLY_WORKFLOW set starts
# this workflow through workflow_dispatch a few minutes after feedback arrives.
#
# Repository secrets in the inbox:
#   OCDB_BOT_CLIENT_ID    Client ID of the opencampingdb-bot GitHub App
#   OCDB_BOT_PRIVATE_KEY  Private key of the opencampingdb-bot GitHub App
#   PLACES_TOKEN          The intake's PLACES_TOKEN, the same value as the Worker secret

name: Apply feedback

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    uses: opencampingdb/feedback-engine/.github/workflows/apply-feedback.yml@REPLACE_WITH_ENGINE_SHA
    with:
      engine-ref: REPLACE_WITH_ENGINE_SHA
      intake-url: REPLACE_WITH_INTAKE_URL
      release-workflow: release.yml
    secrets:
      app-client-id: ${{ secrets.OCDB_BOT_CLIENT_ID }}
      app-private-key: ${{ secrets.OCDB_BOT_PRIVATE_KEY }}
      places-token: ${{ secrets.PLACES_TOKEN }}

# Photo server for an app's own photo service (docs/photos.md). Replace every
# REPLACE_ME and replace-me value before deploying, or
# deploy with an untracked copy holding the real ids (see docs/photos.md).
# Secrets are set with `wrangler secret put`, never written here:
#   PHOTO_KEYS         JSON map of photo key to {"app": "<name>", "daily_limit": <reads a day>}
#   PHOTO_PASS_SECRET  the same secret as the intake's, to check photo passes

name = "replace-me-photo-server"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# Photos are served only on the custom domain, where the cache sits in front.
workers_dev = false

routes = [{ pattern = "REPLACE_ME_PHOTOS_HOST", custom_domain = true }]

[vars]
# Most uncached reads (R2 reads) a day across every app. Above it the server answers 503 until midnight UTC.
DAILY_READ_CAP = "200000"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "replace-me-serving-bucket"

# The off switch (key "off"), the read counters and withheld photos.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_ME_PHOTO_STATE_KV_NAMESPACE_ID"

# Requests per client address, for app keys and passes that name no install: 300 a minute.
[[ratelimits]]
name = "PER_IP"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

# Requests per install, for passes that name the install: 120 a minute. A phone opening a 20-stop trip
# asks for about 40 records and thumbnails at once.
[[ratelimits]]
name = "PER_INSTALL"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# The per-address ceiling behind PER_INSTALL: 3,000 a minute, so phones sharing one address (carrier NAT,
# a caravan park's Wi-Fi) are not held to one phone's share. Bind both or neither: without this one,
# per-install requests are held to PER_IP too. namespace_id values must be unique in your account.
[[ratelimits]]
name = "PER_IP_CEILING"
namespace_id = "1004"
simple = { limit = 3000, period = 60 }

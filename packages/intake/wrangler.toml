# Open Camping DB feedback intake. Replace every REPLACE_ME before deploying.
# Secrets are set with `wrangler secret put`, never written here:
#   APP_KEYS            JSON map of app key to {"app": "<name>", "daily_limit": <number>}
#   DEVICE_SALT         long random string used to hash device ids
#   GH_APP_ID           GitHub App id
#   GH_APP_PRIVATE_KEY  GitHub App private key (PEM)
#   GH_INSTALLATION_ID  installation id of the App on the inbox repository
#   PHOTO_PASS_SECRET   signs photo passes, the same secret as the photo server's. Only for /v1/photos/pass
#   GOOGLE_SERVICE_ACCOUNT  Google service account key file (JSON), only for app keys with "android"
#   PLACES_TOKEN        lets the apply run remove places from RECENT_LIST and send the block list. Only with RECENT_LIST
#   URLHAUS_KEY         abuse.ch auth key, for the URLhaus check on links (src/checks.ts)

name = "ocdb-feedback-intake"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
INBOX_REPO = "opencampingdb/inbox"
INBOX_BRANCH = "main"
# Comma separated list of web origins allowed to call the intake, or * for any.
ALLOWED_ORIGINS = "*"
# "on" checks each uploaded photo with Google Cloud Vision SafeSearch, as the
# GOOGLE_SERVICE_ACCOUNT secret (its project needs the Cloud Vision API turned on).
SAFESEARCH = "off"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_ME_KV_NAMESPACE_ID"

# Registered App Attest keys and challenges. Needed only for app keys with "ios".
[[kv_namespaces]]
binding = "ATTEST"
id = "REPLACE_ME_ATTEST_KV_NAMESPACE_ID"

# The recent list: new places served by GET /v1/places/recent until the apply
# run writes them into the data, with their evidence and the block list. Apply
# the schema with the deploy copy of this file, once it holds the database_id:
# `npx wrangler d1 migrations apply RECENT_LIST --remote -c wrangler.deploy.toml`.
[[d1_databases]]
binding = "RECENT_LIST"
database_name = "ocdb-recent-list"
database_id = "REPLACE_ME_RECENT_LIST_D1_DATABASE_ID"
migrations_dir = "migrations"

# Only when this intake is an app's own photo service (docs/photos.md): uncomment
# and fill in. The pending bucket holds uploads until their record is merged. Give
# it a lifecycle rule that deletes objects 180 days after upload. PHOTO_STATE is
# the photo server's state namespace, where illegal-content reports withhold a photo.
# [[r2_buckets]]
# binding = "PHOTOS_PENDING"
# bucket_name = "replace-me-pending-bucket"
#
# [[kv_namespaces]]
# binding = "PHOTO_STATE"
# id = "REPLACE_ME_PHOTO_STATE_KV_NAMESPACE_ID"

# Workers AI, for the Llama Guard check on free text (src/checks.ts). The
# account needs Workers AI. Uncomment when the checks are wired in.
# [ai]
# binding = "AI"

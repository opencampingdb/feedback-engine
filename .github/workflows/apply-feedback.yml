# Reusable workflow: applies feedback from the calling repository (the private
# inbox) to opencampingdb/data, or, with places-repository set, photos to an
# app's own photo repository. Call it from the inbox repository on a
# schedule; see packages/apply/examples/inbox-apply-feedback.yml.
# The data repository must sit in the same organisation as the inbox.
#
# Each run keeps at most two open PRs to data, on fixed branches:
#   feedback/auto    automatic changes only, merges itself when CI passes. The data
#                    repository needs Allow auto-merge (allow_auto_merge) on and a required
#                    check on the base branch for that. Without them the run shows an error
#                    annotation and the PR says it needs merging by hand, and the run goes on.
#   feedback/review  changes and reports a person decides on, label needs-review
# When a PR from a branch is already open, the run adds a commit and a comment
# to it instead of opening another. Owner claims and listings go to
# feedback/review with an approval box each and the label owner-claim; the next
# run reads the merged PR and approves the ticked ones. The inbox moves are committed last, rebased
# onto any files the intake wrote meanwhile, so a failed run is simply
# repeated: the apply script writes nothing it has already written, and decides
# a takedown it already wrote as it did then. A PR or PR text GitHub refuses is
# reported and the other inbox moves are still recorded, with the items that PR
# was to carry put back in pending/ for a later run. The publish steps share
# packages/apply/scripts/publish.sh from the engine checkout.
#
# Both tokens come from the deployment's bot GitHub App, never GITHUB_TOKEN,
# so the data PRs trigger the data repository's CI.
#
# With intake-url and the places-token secret, each run also keeps the
# intake's recent places store and recent changes in step with the data on the
# base branch: it tells the intake which applied changes the base branch now
# holds (so a change counts only once its PR has merged, at the next run), and
# which items it decided other than applying them, which leave the list at once.
#
# With release-workflow set, a run that opened or added to the automatic PR
# waits for it to merge, then starts the data repository's release workflow,
# so the change reaches apps without waiting for the release's own schedule.
# The bot GitHub App needs Actions: Read and write on the data repository for
# that. Without it the run logs a warning and the release's schedule picks the
# change up.

name: Apply feedback

on:
  workflow_call:
    inputs:
      data-repository-name:
        description: Name of the data repository, in the same organisation as the inbox
        type: string
        default: data
      data-base-branch:
        description: Branch of the data repository PRs go to
        type: string
        default: main
      engine-repository:
        description: owner/name of the feedback-engine repository
        type: string
        default: opencampingdb/feedback-engine
      engine-ref:
        description: Commit of feedback-engine to run. Use the same SHA the caller pins this workflow to.
        type: string
        required: true
      places-repository:
        description: >-
          For an app's own photo repository: owner/name of the Open Camping DB
          data repository to read place records from (opencampingdb/data). Set
          it and the run takes photos only, writing photo lines to the data
          repository named above.
        type: string
        default: ""
      photo-licence:
        description: Licence id written on new photo lines
        type: string
        default: CC-BY-4.0
      hold-first-photo:
        description: >-
          Hold each contributor's first photo for a person. Set it to false to
          publish a first photo at once when the intake's SafeSearch rating
          passed it. A photo with no rating still waits.
        type: boolean
        default: true
      intake-url:
        description: >-
          Base URL of the intake that serves recent new places, for example
          https://intake.example.org. Set it with the places-token secret and
          each run takes places now in the data on the base branch, and
          withdrawn ones, out of the intake's recent places store, and sends
          it the block list. It also tells the intake which applied fact and
          contact reports the base branch now holds, and which items the run
          decided other than applying them. With places-repository set, it is
          the app's photo intake instead, and each run sends it only where
          each photo is (GET /v1/photos/progress).
        type: string
        default: ""
      recent-places-url:
        description: >-
          Base URL of an intake whose recent list (GET /v1/places/recent) the
          run reads, for example https://intake.example.org. Photos and
          reports about a new place on that list that is not in the data yet
          wait in pending/ for a later run instead of being refused. An app's
          own photo inbox sets it to Open Camping DB's intake. Off when empty.
        type: string
        default: ""
      review-preview-url:
        description: >-
          Base URL of the intake that serves held photos to the person
          checking the review PR (GET /v1/photos/review/...), for example
          https://photos-upload.example.org. Set it with the
          review-preview-secret secret (the intake's REVIEW_PREVIEW_SECRET)
          and each held photo in the review PR gets a link that works for 30
          days. Only for a private data repository. Off when empty.
        type: string
        default: ""
      release-workflow:
        description: >-
          File name or id of the data repository's release workflow, for
          example release.yml. When set, a run that changed the data starts it
          on data-base-branch once the automatic PR has merged. Off when empty.
        type: string
        default: ""
    secrets:
      app-client-id:
        description: Client ID of the bot GitHub App
        required: true
      app-private-key:
        description: Private key of the bot GitHub App
        required: true
      places-token:
        description: The intake's PLACES_TOKEN. Needed only with intake-url.
        required: false
      review-preview-secret:
        description: The intake's REVIEW_PREVIEW_SECRET. Needed only with review-preview-url.
        required: false

permissions:
  contents: read

concurrency:
  group: apply-feedback-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply feedback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Token for the inbox
        id: inbox-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Token for the data repository
        id: data-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.data-repository-name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.engine-repository }}
          ref: ${{ inputs.engine-ref }}
          path: engine
          persist-credentials: false

      - name: Check out the inbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: inbox
          token: ${{ steps.inbox-token.outputs.token }}

      - name: Check out data for automatic changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
          ref: ${{ inputs.data-base-branch }}
          path: data-auto
          fetch-depth: 0
          token: ${{ steps.data-token.outputs.token }}

      - name: Check out data for review changes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
          ref: ${{ inputs.data-base-branch }}
          path: data-review
          fetch-depth: 0
          token: ${{ steps.data-token.outputs.token }}

      # Before data main is checked out, so every merged PR read here is in that checkout: the apply
      # counts a change as turned down only when its PR is merged or closed without it.
      - name: Read recent review and automatic PRs for owner approvals and progress
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
          APP_SLUG: ${{ steps.data-token.outputs.app-slug }}
          DATA_REPO: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
        run: |
          # The 100 most recent PRs from each branch, with every comment. The apply keeps only the
          # bot's own (botPrs in packages/apply), so the one author rule decides, and owner
          # approvals read the 30 most recent of those. Read through GraphQL, which gives each
          # author's account type, so the bot is known as an account of type Bot and never by its
          # login alone.
          query='query($owner: String!, $name: String!, $head: String!) {
            repository(owner: $owner, name: $name) {
              pullRequests(headRefName: $head, first: 100, orderBy: {field: CREATED_AT, direction: DESC}) {
                nodes { number state body isCrossRepository author { __typename login }
                  comments(first: 100) { pageInfo { hasNextPage endCursor } nodes { author { __typename login } body } } }
              }
            }
          }'
          more='query($owner: String!, $name: String!, $number: Int!, $after: String!) {
            repository(owner: $owner, name: $name) {
              pullRequest(number: $number) {
                comments(first: 100, after: $after) { pageInfo { hasNextPage endCursor } nodes { author { __typename login } body } }
              }
            }
          }'
          # Comments are read 100 at a time, oldest first. A PR with more than this many pages stops
          # the run, rather than leave its newer approval boxes unread.
          max_pages=30
          for kind in review auto; do
            page="$RUNNER_TEMP/$kind-page.json"
            extra="$RUNNER_TEMP/$kind-more-comments.json"
            gh api graphql -f query="$query" -f owner="${DATA_REPO%%/*}" -f name="${DATA_REPO#*/}" -f head="feedback/$kind" < /dev/null > "$page"
            echo '[]' > "$extra"
            jq -r '.data.repository.pullRequests.nodes[] | select(.comments.pageInfo.hasNextPage == true)
              | "\(.number) \(.comments.pageInfo.endCursor)"' "$page" > "$RUNNER_TEMP/$kind-cursors"
            while read -r number cursor; do
              pages=1
              while [ -n "$cursor" ]; do
                if [ "$pages" -ge "$max_pages" ]; then
                  echo "::error::PR ${number} on ${DATA_REPO} has more than $((max_pages * 100)) comments, more than the run reads. Move its approval boxes to a new PR, or close it, then run again."
                  exit 1
                fi
                gh api graphql -f query="$more" -f owner="${DATA_REPO%%/*}" -f name="${DATA_REPO#*/}" -F number="$number" -f after="$cursor" \
                  < /dev/null > "$RUNNER_TEMP/comments.json"
                jq --argjson n "$number" --slurpfile got "$RUNNER_TEMP/comments.json" \
                  '. + [{number: $n, nodes: $got[0].data.repository.pullRequest.comments.nodes}]' "$extra" > "$extra.next"
                mv "$extra.next" "$extra"
                cursor="$(jq -r '.data.repository.pullRequest.comments.pageInfo | if .hasNextPage == true then .endCursor else "" end' "$RUNNER_TEMP/comments.json")"
                pages=$((pages + 1))
              done
            done < "$RUNNER_TEMP/$kind-cursors"
            jq --slurpfile extra "$extra" 'def who: if . == null then null else {login, type: .__typename} end;
              [.data.repository.pullRequests.nodes[] | .number as $n
                | {number, state, body, isCrossRepository, author: (.author | who),
                   comments: [(.comments.nodes + [$extra[0][] | select(.number == $n) | .nodes[]])[]
                     | {author: (.author | who), body}]}]' "$page" > "$RUNNER_TEMP/$kind-prs.json"
          done

      - name: Check out data main for the recent places store
        if: inputs.intake-url != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
          ref: ${{ inputs.data-base-branch }}
          path: data-main
          sparse-checkout: |
            places
            moderation
            reviews
            photos
          persist-credentials: false
          token: ${{ steps.data-token.outputs.token }}

      # The last 14 days of main's history, so each change in the data is dated by the commit that
      # brought it in. A file last changed before then is dated by main's last commit.
      - name: Fetch 14 days of data main's history
        if: inputs.intake-url != ''
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
          BASE_BRANCH: ${{ inputs.data-base-branch }}
        working-directory: data-main
        run: |
          since="$(date -u -d '14 days ago' +%Y-%m-%d)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --quiet --filter=blob:none --shallow-since="$since" origin "$BASE_BRANCH" ||
            echo "::warning::could not fetch data main's history, so changes are dated by its last commit"

      - name: Check out Open Camping DB place records
        if: inputs.places-repository != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.places-repository }}
          path: places
          sparse-checkout: |
            places
            schema
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the apply script
        working-directory: engine
        run: |
          npm ci --ignore-scripts --include-workspace-root --workspace packages/sdk --workspace packages/apply
          npm run build

      - name: Start from the open PR branches
        id: branches
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
          APP_SLUG: ${{ steps.data-token.outputs.app-slug }}
          DATA_REPO: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
          BASE_BRANCH: ${{ inputs.data-base-branch }}
        run: |
          bot_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          echo "bot_email=${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"
          for kind in auto review; do
            branch="feedback/${kind}"
            dir="data-${kind}"
            git -C "$dir" config user.name "${APP_SLUG}[bot]"
            git -C "$dir" config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
            # Only the bot's own PR from the data repository counts, never one
            # from a fork that uses the same branch name. A PR from the data
            # repository by anyone else stops the run before the branch is replaced.
            # The GitHub CLI gives an author's login alone, so this is isBotAuthor in
            # packages/apply for an author with no account type (workflow.test.ts pins
            # the two together).
            prs="$(gh pr list --repo "$DATA_REPO" --head "$branch" --base "$BASE_BRANCH" --state open --limit 100 \
              --json number,isCrossRepository,author)"
            same_repo() {
              jq -r --arg slug "$APP_SLUG" --argjson bot "$1" '[.[] | select(.isCrossRepository == false and
                ((.author.login as $l | any("\($slug)[bot]", "app/\($slug)"; . == $l)) == $bot))] | first | .number // empty' <<< "$prs"
            }
            other="$(same_repo false)"
            if [ -n "$other" ]; then
              echo "::error::PR #${other} on ${branch} was not opened by ${APP_SLUG}. Close it or move it to another branch, then run again."
              exit 1
            fi
            pr="$(same_repo true)"
            echo "${kind}_pr=${pr}" >> "$GITHUB_OUTPUT"
            if [ -n "$pr" ]; then
              git -C "$dir" fetch origin "$branch"
              git -C "$dir" switch -c "$branch" "origin/${branch}"
              # Keep the branch current with the base. On a conflict, carry on
              # from the branch as it is and leave the conflict to the PR.
              git -C "$dir" merge --no-edit "origin/${BASE_BRANCH}" || git -C "$dir" merge --abort
              echo "${kind}_open=true" >> "$GITHUB_OUTPUT"
            else
              git -C "$dir" switch -c "$branch"
              echo "${kind}_open=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Apply feedback
        id: apply
        env:
          APP_SLUG: ${{ steps.data-token.outputs.app-slug }}
          PLACES_ARGS: ${{ inputs.places-repository != '' && '--places places' || '' }}
          PHOTO_LICENCE: ${{ inputs.photo-licence }}
          FIRST_PHOTO_ARGS: ${{ !inputs.hold-first-photo && '--publish-first-photo' || '' }}
          INTAKE_URL: ${{ inputs.intake-url }}
          RECENT_PLACES_URL: ${{ inputs.recent-places-url }}
          PLACES_TOKEN: ${{ secrets.places-token }}
          REVIEW_PREVIEW_URL: ${{ inputs.review-preview-url }}
          REVIEW_PREVIEW_SECRET: ${{ secrets.review-preview-secret }}
        run: >
          node engine/packages/apply/dist/cli.js
          $PLACES_ARGS
          $FIRST_PHOTO_ARGS
          ${INTAKE_URL:+--main data-main --intake "$INTAKE_URL"}
          ${RECENT_PLACES_URL:+--recent-places "$RECENT_PLACES_URL"}
          ${REVIEW_PREVIEW_URL:+--review-preview "$REVIEW_PREVIEW_URL"}
          --photo-licence "$PHOTO_LICENCE"
          --inbox inbox
          --data data-auto
          --review-data data-review
          --review-prs "$RUNNER_TEMP/review-prs.json"
          --auto-prs "$RUNNER_TEMP/auto-prs.json"
          --bot-login "$APP_SLUG"
          --auto-pr-body "$RUNNER_TEMP/auto-pr-body.md"
          --review-pr-body "$RUNNER_TEMP/review-pr-body.md"
          --job-summary "$GITHUB_STEP_SUMMARY"
          --summary "$RUNNER_TEMP/summary.json"

      - name: Publish automatic changes
        id: publish-auto
        if: steps.apply.outputs.auto_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
          DATA_REPO: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
          BASE_BRANCH: ${{ inputs.data-base-branch }}
          PR_OPEN: ${{ steps.branches.outputs.auto_open }}
          PR_NUMBER: ${{ steps.branches.outputs.auto_pr }}
          RUN_ID: ${{ github.run_id }}
          ENGINE_DIR: ${{ github.workspace }}/engine
        working-directory: data-auto
        run: |
          . "$ENGINE_DIR/packages/apply/scripts/publish.sh"
          body="$RUNNER_TEMP/auto-pr-body.md"
          # Asks GitHub to merge PR $1 once CI passes. Where it can't (allow_auto_merge off, or
          # no required check on the base branch), says so loudly and returns 1, never failing
          # the run: the inbox moves still have to be recorded.
          auto_merge() {
            if out="$(gh pr merge "$1" --repo "$DATA_REPO" --auto --squash 2>&1)"; then return 0; fi
            echo "$out"
            echo "::error title=Auto-merge is off on ${DATA_REPO}::The automatic PR ${1} on ${DATA_REPO} needs merging by hand, so its changes wait until someone merges it. Turn on Allow auto-merge (allow_auto_merge) in the repository's settings, under General, Pull Requests, and protect ${BASE_BRANCH} with a required status check."
            return 1
          }
          # The apply writes that the PR merges itself. Says instead that it needs merging by hand.
          by_hand() {
            sed -i.orig "s|so this PR merges itself once CI passes\.|but auto-merge is off on ${DATA_REPO}, so this PR needs merging by hand once CI passes.|" "$body"
            rm -f "$body.orig"
          }
          # The inbox step moves this run's items for the PR back to pending/ unless landed=true:
          # their changes are on an open PR, or already on the base branch.
          git add -A
          start="$(git rev-parse HEAD)"
          git commit -m "Apply feedback automatically (run ${RUN_ID})"
          if [ "$PR_OPEN" = "true" ] && gone "$PR_NUMBER"; then
            restart "$start" "$PR_NUMBER"
            PR_OPEN=false
          fi
          if [ "$PR_OPEN" = "true" ]; then
            git push origin HEAD:refs/heads/feedback/auto
            # Auto-merge is on for this PR, so it may have merged between the read above and the
            # push, leaving the pushed commit on a branch with no PR. Read again, and if it went,
            # move the commit to a new PR.
            if gone "$PR_NUMBER"; then
              restart "$start" "$PR_NUMBER"
              PR_OPEN=false
            fi
          fi
          if [ "$PR_OPEN" = "true" ]; then
            echo "landed=true" >> "$GITHUB_OUTPUT"
            # Asked again each run while it is not set, in case the setting was turned on since.
            set_already="$(gh pr view "$PR_NUMBER" --repo "$DATA_REPO" --json autoMergeRequest --jq '.autoMergeRequest != null' || echo false)"
            if [ "$set_already" != "true" ] && ! auto_merge "$PR_NUMBER"; then by_hand; fi
            # The changes are on the branch already: a refused comment is said loudly, and the
            # run still records its inbox moves, so the same items are not applied again.
            gh pr comment "$PR_NUMBER" --repo "$DATA_REPO" --body-file "$body" ||
              echo "::error title=PR comment refused::could not comment on PR ${PR_NUMBER} on ${DATA_REPO}; the run's changes are on feedback/auto and listed in this run's job summary"
            echo "pr=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          elif [ "$(ahead)" -eq 0 ]; then
            # The PR merged with this run's commit in it: the base branch holds every change.
            echo "::notice::the base branch already holds this run's automatic changes"
            echo "landed=true" >> "$GITHUB_OUTPUT"
            echo "pr=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            # No open PR uses the branch, so it can be replaced.
            git push --force origin HEAD:refs/heads/feedback/auto
            if url="$(gh pr create --repo "$DATA_REPO" --base "$BASE_BRANCH" --head feedback/auto \
              --title "Feedback: automatic changes" --body-file "$body")"; then
              echo "landed=true" >> "$GITHUB_OUTPUT"
              echo "pr=${url}" >> "$GITHUB_OUTPUT"
              if ! auto_merge "$url"; then
                by_hand
                gh pr edit "$url" --repo "$DATA_REPO" --body-file "$body" ||
                  echo "::warning::could not say on ${url} that it needs merging by hand"
              fi
            else
              # Said loudly, and the run goes on: the inbox step puts this run's items back in pending/.
              echo "::error title=PR refused::could not open the automatic PR on ${DATA_REPO}; this run's automatic items go back to pending/ for a later run"
            fi
          fi

      - name: Publish changes for review
        id: publish-review
        if: steps.apply.outputs.review_changed == 'true'
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
          DATA_REPO: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
          BASE_BRANCH: ${{ inputs.data-base-branch }}
          PR_OPEN: ${{ steps.branches.outputs.review_open }}
          PR_NUMBER: ${{ steps.branches.outputs.review_pr }}
          OWNER_CLAIMS: ${{ steps.apply.outputs.owner_claims }}
          RUN_ID: ${{ github.run_id }}
          ENGINE_DIR: ${{ github.workspace }}/engine
        working-directory: data-review
        run: |
          . "$ENGINE_DIR/packages/apply/scripts/publish.sh"
          body="$RUNNER_TEMP/review-pr-body.md"
          # GitHub may refuse a text (one too long, say, or a PR it will not open). That is said
          # loudly and the run goes on. The run's items are recorded as decided only when an open
          # PR carries the text that lists them (claims_listed): otherwise the inbox step puts
          # them back in pending/, so a later run decides them again.
          refused() {
            echo "::error title=PR text refused::could not $1 on ${DATA_REPO}; this run's items for a person go back to pending/ for a later run"
          }
          # Held and closed cases the body had no room for, in order: review-pr-body.md.2, .3 and so on.
          follow_ups() {
            n=2
            while [ -e "${body}.${n}" ]; do
              gh pr comment "$1" --repo "$DATA_REPO" --body-file "${body}.${n}" || refused "add comment ${n} to PR ${1}"
              n=$((n + 1))
            done
          }
          git add -A
          start="$(git rev-parse HEAD)"
          if ! git diff --cached --quiet; then
            git commit -m "Feedback for review (run ${RUN_ID})"
          fi
          if [ "$PR_OPEN" = "true" ] && gone "$PR_NUMBER"; then
            restart "$start" "$PR_NUMBER"
            PR_OPEN=false
          fi
          if [ "$PR_OPEN" = "true" ]; then
            local_head="$(git rev-parse HEAD)"
            # The intake's AI reviewer commits to this branch at any time. Rebase
            # onto its commits and retry, keeping the merge of the base branch
            # made above.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git fetch origin "+refs/heads/feedback/review:refs/remotes/origin/feedback/review" &&
                git rebase --rebase-merges origin/feedback/review &&
                git push origin HEAD:refs/heads/feedback/review; then
                pushed=true
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::could not push to feedback/review after 5 attempts"
              exit 1
            fi
            # A person may have merged or closed the PR between the read above and the push. If so,
            # this run's commits go to a new PR from the base branch.
            if gone "$PR_NUMBER"; then
              git reset --hard "$local_head"
              restart "$start" "$PR_NUMBER"
              PR_OPEN=false
            fi
          fi
          if [ "$PR_OPEN" = "true" ]; then
            if gh pr comment "$PR_NUMBER" --repo "$DATA_REPO" --body-file "$body"; then
              echo "claims_listed=true" >> "$GITHUB_OUTPUT"
              follow_ups "$PR_NUMBER"
            else
              refused "comment on PR ${PR_NUMBER}"
            fi
            if [ "$OWNER_CLAIMS" = "true" ]; then
              gh pr edit "$PR_NUMBER" --repo "$DATA_REPO" --add-label owner-claim ||
                echo "::warning::could not label PR ${PR_NUMBER} on ${DATA_REPO} owner-claim"
            fi
          else
            # A run whose only items are reports to read changes no file, and the base branch may
            # already hold a merged PR's changes. The empty commit still lets a PR carry them.
            if [ "$(ahead)" -eq 0 ]; then
              git commit --allow-empty -m "Feedback for review (run ${RUN_ID})"
            fi
            git push --force origin HEAD:refs/heads/feedback/review
            if url="$(gh pr create --repo "$DATA_REPO" --base "$BASE_BRANCH" --head feedback/review \
              --title "Feedback: for a person to check" --body-file "$body")"; then
              echo "claims_listed=true" >> "$GITHUB_OUTPUT"
              follow_ups "$url"
              # Labels go on in their own call, so a missing label never stops the PR.
              labels="needs-review"
              if [ "$OWNER_CLAIMS" = "true" ]; then labels="needs-review,owner-claim"; fi
              gh pr edit "$url" --repo "$DATA_REPO" --add-label "$labels" ||
                echo "::warning::could not label ${url} on ${DATA_REPO} ${labels}"
            else
              refused "open the review PR"
            fi
          fi

      - name: Commit the inbox moves
        if: steps.apply.outputs.inbox_changed == 'true'
        env:
          APP_SLUG: ${{ steps.inbox-token.outputs.app-slug }}
          BOT_EMAIL: ${{ steps.branches.outputs.bot_email }}
          RUN_ID: ${{ github.run_id }}
          AUTO_CHANGED: ${{ steps.apply.outputs.auto_changed }}
          AUTO_LANDED: ${{ steps.publish-auto.outputs.landed }}
          REVIEW_CHANGED: ${{ steps.apply.outputs.review_changed }}
          CLAIMS_LISTED: ${{ steps.publish-review.outputs.claims_listed }}
        working-directory: inbox
        run: |
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$BOT_EMAIL"
          # Undoes the moves listed under $1 in the run summary: each item goes back to pending/,
          # so a later run decides it again.
          put_back() {
            jq -r --arg key "$1" '(.[$key] // [])[] | .from, .to' "$RUNNER_TEMP/summary.json" > "$RUNNER_TEMP/put-back"
            while read -r from && read -r to; do
              rm -f -- "$to"
              git checkout HEAD -- "$from"
            done < "$RUNNER_TEMP/put-back"
          }
          if [ "$REVIEW_CHANGED" = "true" ] && [ "$CLAIMS_LISTED" != "true" ]; then
            # No open PR lists this run's owner claims and items for a person.
            put_back claim_moves
            put_back review_moves
          fi
          if [ "$AUTO_CHANGED" = "true" ] && [ "$AUTO_LANDED" != "true" ]; then
            # No open PR carries this run's automatic changes, and the base branch does not hold them.
            put_back auto_moves
          fi
          git add -A
          if git diff --cached --quiet; then
            echo "No inbox moves to record."
            exit 0
          fi
          git commit -m "Move applied and refused feedback (run ${RUN_ID})"
          # The intake may have added pending files since the checkout. Rebase
          # onto them and retry. Rename detection stays off because whole day
          # folders move while the intake adds new files to them.
          branch="$(git rev-parse --abbrev-ref HEAD)"
          for attempt in 1 2 3 4 5; do
            if git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" &&
              git -c merge.directoryRenames=false rebase "origin/${branch}" &&
              git push origin "HEAD:refs/heads/${branch}"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::could not record the inbox moves after 5 attempts"
          exit 1

      # The release builds from the base branch, so it starts only once the
      # automatic PR has merged. A missing permission, a PR still waiting or a
      # failed start leaves the change to the release's own schedule and never
      # fails the run.
      - name: Token to start the data release
        id: release-token
        if: inputs.release-workflow != '' && steps.publish-auto.outputs.pr != ''
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.data-repository-name }}
          permission-actions: write

      - name: Start the data release
        if: inputs.release-workflow != '' && steps.publish-auto.outputs.pr != ''
        continue-on-error: true
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ steps.data-token.outputs.token }}
          RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          DATA_REPO: ${{ format('{0}/{1}', github.repository_owner, inputs.data-repository-name) }}
          BASE_BRANCH: ${{ inputs.data-base-branch }}
          RELEASE_WORKFLOW: ${{ inputs.release-workflow }}
          PR: ${{ steps.publish-auto.outputs.pr }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::warning::No token with Actions: Read and write on ${DATA_REPO}, so the release's schedule will publish this change. Give the bot GitHub App that permission."
            exit 0
          fi
          # Data CI usually takes two to three minutes before the PR merges itself.
          # A PR without auto-merge waits for a person, so the run stops waiting.
          state=""
          for _ in $(seq 1 40); do
            state="$(gh pr view "$PR" --repo "$DATA_REPO" --json state,autoMergeRequest \
              --jq 'if .state == "OPEN" and .autoMergeRequest == null then "MANUAL" else .state end')" || state=""
            if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ] || [ "$state" = "MANUAL" ]; then break; fi
            sleep 15
          done
          if [ "$state" != "MERGED" ]; then
            echo "::notice::The automatic PR is ${state:-unknown}, not merged, so the release's schedule will publish it."
            exit 0
          fi
          if GH_TOKEN="$RELEASE_TOKEN" gh workflow run "$RELEASE_WORKFLOW" --repo "$DATA_REPO" --ref "$BASE_BRANCH"; then
            echo "Started ${RELEASE_WORKFLOW} on ${DATA_REPO}@${BASE_BRANCH}."
          else
            echo "::warning::Starting ${RELEASE_WORKFLOW} on ${DATA_REPO} failed, so the release's schedule will publish this change."
          fi
